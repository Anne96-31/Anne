name: 每日商務英文

on:
  schedule:
    # 每天台北時間 06:47（UTC 22:47）產生當天課程，避開整點排程延遲
    - cron: "47 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-english
  cancel-in-progress: false

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt pytest

      - name: 單元測試
        run: python -m pytest -q tests

      - name: 產生課程並寫入 Notion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ENGLISH_DATABASE_ID: ${{ secrets.NOTION_ENGLISH_DATABASE_ID }}
        run: python -m dailyenglish
