name: 台股每日投資日報

on:
  schedule:
    # 備援排程：主要由 Claude 排程任務每天台北 07:50 以 workflow_dispatch 觸發。
    # GitHub 排程常延遲數小時才開始；若當天日報已產生，下方 check job 會略過。
    - cron: "43 23 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "依成交金額掃描前 N 檔"
        default: "800"

permissions:
  contents: write

env:
  RETENTION_DAYS: "15"   # 日報保存天數（GitHub 檔案與 Notion 頁面）

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: 今天的日報是否已產生
        run: |
          today=$(TZ=Asia/Taipei date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "reports/$today.md" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "reports/$today.md 已存在（07:50 的觸發已完成），略過備援排程"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt pytest

      - name: 單元測試
        run: python -m pytest -q tests

      - name: 產生日報
        id: report
        run: python -m twdaily --top "${{ github.event.inputs.top || '800' }}" --out reports

      - name: 刪除超過 15 天的日報
        run: python -m twdaily.cleanup reports --days "$RETENTION_DAYS"

      - name: 提交日報
        run: |
          git config user.name "twdaily-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "日報：$(TZ=Asia/Taipei date +%Y-%m-%d)"
          # 其他 workflow（AI 摘要、英文）或合併 PR 也會推到 master，
          # 推送被拒時先拉最新版本再重試，最多 5 次
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "推送失敗，第 $i 次重試…"
            sleep $((i * 5))
          done
          exit 1

      - name: 同步到 Notion
        # 只要日報有產生就同步，即使推回 GitHub 失敗也不影響 Notion
        # 未設定 secrets 時會自動略過
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m twdaily.notion reports/latest.md reports/latest.json

      - name: 顯示摘要
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
