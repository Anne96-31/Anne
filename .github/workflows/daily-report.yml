name: 台股每日投資日報

on:
  schedule:
    # 每天台北時間 07:43（UTC 23:43）開始，8:00 前完成：前一交易日收盤 + 美股隔夜行情
    # 避開整點：GitHub 排程在整點最擁擠，容易延遲甚至略過
    - cron: "43 23 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "依成交金額掃描前 N 檔"
        default: "800"

permissions:
  contents: write

env:
  RETENTION_DAYS: "15"   # 日報保存天數（GitHub 檔案與 Notion 頁面）

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt pytest

      - name: 單元測試
        run: python -m pytest -q tests

      - name: 產生日報
        run: python -m twdaily --top "${{ github.event.inputs.top || '800' }}" --out reports

      - name: 刪除超過 15 天的日報
        run: python -m twdaily.cleanup reports --days "$RETENTION_DAYS"

      - name: 提交日報
        run: |
          git config user.name "twdaily-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "日報：$(TZ=Asia/Taipei date +%Y-%m-%d)"
          git push

      - name: 同步到 Notion
        # 未設定 secrets 時會自動略過
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m twdaily.notion reports/latest.md reports/latest.json

      - name: 顯示摘要
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
