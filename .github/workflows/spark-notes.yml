name: Spark & Databricks 學習筆記同步

on:
  # 筆記有更新並合併進 master 時自動同步
  push:
    branches: [master]
    paths:
      - "sparklearn/**"
  workflow_dispatch:
    inputs:
      lessons:
        description: "要同步的課號，用空白分隔（例如 1 3）；留空代表全部"
        default: ""

permissions:
  contents: read

concurrency:
  group: spark-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt pytest

      - name: 單元測試
        run: python -m pytest -q tests/test_sparklearn.py

      - name: 寫入 Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SPARK_PAGE_ID: ${{ secrets.NOTION_SPARK_PAGE_ID }}
          LESSONS: ${{ github.event.inputs.lessons }}
        run: |
          if [ -n "$LESSONS" ]; then
            python -m sparklearn --lesson $LESSONS | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python -m sparklearn | tee -a "$GITHUB_STEP_SUMMARY"
          fi
